name: Build Geode Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Mod
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Clean Old Build Cache
        run: |
          if (Test-Path geode-mod/build) { Remove-Item -Recurse -Force geode-mod/build }
        shell: powershell

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: geode-mod

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-layout-generator-mod
          path: geode-mod/*.geode
