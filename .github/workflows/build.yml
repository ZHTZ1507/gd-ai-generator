name: Build Geode Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Mod
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC C++ Compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      - name: Clean Old Build Cache
        run: |
          if (Test-Path geode-mod/build) { Remove-Item -Recurse -Force geode-mod/build }
        shell: powershell

      - name: Build Mod
        run: |
          cd geode-mod
          geode build --platform win

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-layout-generator-mod
          path: geode-mod/*.geode
